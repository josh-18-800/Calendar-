<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1 id="month-year">June 2026</h1>

            <button id="darkModeBtn">
                Toggle Dark Mode
            </button>
        </header>

        <section class="weather-card">
            <h2>Weather Information</h2>
            <p>🌡 Temperature: <span id="temp">28°C</span></p>
            <p>💧 Humidity: <span id="humidity">72%</span></p>
        </section>

        <section class="calendar">

            <div class="days">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendar-dates" class="dates"></div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
